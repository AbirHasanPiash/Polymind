<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#111219" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafd" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Polymind — every frontier model in one workspace. Chat with GPT, Claude and Gemini, compare them side by side, and generate images, speech and avatar video from one credit wallet."
    />
    <meta property="og:title" content="Polymind — Every frontier model, one workspace" />
    <meta property="og:description" content="Chat with GPT-5.5, Claude and Gemini, compare them side by side, and create images, voice and video." />
    <meta property="og:type" content="website" />
    <title>Polymind — Every frontier model, one workspace</title>

    <!--
      Theme bootstrap. Runs before the first paint and before React mounts, so
      the correct palette is on <html> from the very first frame.
    -->
    <script>
      (function () {
        try {
          /* Keep this key in sync with THEME_STORAGE_KEY in src/components/theme-context.ts */
          var stored = localStorage.getItem("vite-ui-theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || (stored === "system" && prefersDark);
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.classList.toggle("light", !isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {
          /* Private mode or blocked storage: fall back to the class already on <html>. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
